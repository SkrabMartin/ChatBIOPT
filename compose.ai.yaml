# Optional local inference. Use together with the base file:
#   docker compose -f compose.yaml -f compose.ai.yaml up -d
# Add `-f compose.gpu.yaml` on hosts with an NVIDIA GPU and the NVIDIA Container Toolkit.
# Models are pulled explicitly (see README), never at startup.

services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
