name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bioresearch
          POSTGRES_PASSWORD: bioresearch
          POSTGRES_DB: bioresearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bioresearch"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bioresearch:bioresearch@localhost:5432/bioresearch_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (includes migration up/down round trip)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the frontend proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "<div id=\"root\">"
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          # Migration 0009 (accounts) is live; everything except health and sign-in needs a session
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health | grep -q '"migration_revision":"0009"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/projects)" = 401
      - name: Sign in and use the workspace
        env:
          BIORESEARCH_PASSWORD: ci-smoke-password-123
        run: |
          docker compose exec -T -e BIORESEARCH_PASSWORD backend \
            python -m app.cli create-user --email ci@example.org --name "CI" --admin
          api=http://127.0.0.1:8080/api/v1
          csrf='X-Requested-With: BioResearchAI'
          # Without the CSRF header a state change is refused even with valid credentials
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.org\",\"password\":\"$BIORESEARCH_PASSWORD\"}")" = 403
          curl -fsS -c jar -X POST $api/auth/login -H "$csrf" -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.org\",\"password\":\"$BIORESEARCH_PASSWORD\"}" >/dev/null
          grep -q bioresearch_session jar
          curl -fsS -b jar $api/entities/organisms | jq -e '.[] | select(.taxon_id == 9606)' >/dev/null
      - name: Workspace data survives a full stack restart
        run: |
          api=http://127.0.0.1:8080/api/v1
          csrf='X-Requested-With: BioResearchAI'
          project=$(curl -fsS -b jar -X POST $api/projects -H "$csrf" -H 'Content-Type: application/json' -d '{"title":"CI smoke"}' | jq -r .id)
          conversation=$(curl -fsS -b jar -X POST $api/projects/$project/conversations -H "$csrf" -H 'Content-Type: application/json' -d '{"title":"thread"}' | jq -r .id)
          curl -fsS -b jar -X POST $api/conversations/$conversation/messages -H "$csrf" -H 'Content-Type: application/json' -d '{"content":"persist me"}' >/dev/null
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          # Sessions are server-side rows: the same cookie still works after a full restart
          test "$(curl -fsS -b jar $api/projects/$project | jq -r .title)" = "CI smoke"
          test "$(curl -fsS -b jar $api/conversations/$conversation/messages | jq -r '.items[0].content')" = "persist me"
          test "$(curl -fsS -b jar $api/conversations/$conversation/messages | jq -r '.items[0].author_name')" = "CI"
      - name: UI keeps working when only the backend container is recreated
        run: |
          docker compose up -d --force-recreate --no-deps --wait backend
          sleep 12  # longer than nginx's DNS cache (valid=10s)
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
