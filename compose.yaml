name: bioresearch-ai

services:
  db:
    # pgvector build of PostgreSQL: vector search lands in M06 without a database swap.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioresearch}
      POSTGRES_DB: ${POSTGRES_DB:-bioresearch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: lets local tooling and pytest reach the DB without exposing it on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: bioresearch-ai-backend
    environment: &backend-env
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bioresearch}:${POSTGRES_PASSWORD:-bioresearch}@db:5432/${POSTGRES_DB:-bioresearch}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      # Without compose.ai.yaml the backend looks for Ollama on the Docker host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ALLOW_EXTERNAL_MODELS: ${ALLOW_EXTERNAL_MODELS:-false}
      FULLTEXT_ALLOWED_LICENSES: ${FULLTEXT_ALLOWED_LICENSES:-CC0,CC-BY,CC-BY-SA,CC-BY-ND,CC-BY-NC,CC-BY-NC-SA,CC-BY-NC-ND}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Trust X-Forwarded-For from the nginx frontend, so per-IP sign-in limits see real clients. Safe only
      # because the backend port is published on 127.0.0.1; widen it and clients could spoof their IP.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - objects:/srv/backend/var/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  # Drains the ingestion job queue (evidence documents). Same image; the backend owns migrations.
  worker:
    image: bioresearch-ai-backend
    command: ["python", "-m", "app.workers.ingestion"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - objects:/srv/backend/var/objects
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.ingestion", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  objects:
