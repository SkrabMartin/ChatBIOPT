server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Note: nginx drops inherited add_header directives in any block that declares its own,
    # so security headers are repeated in every location that sets Cache-Control.

    # Docker's embedded DNS. With the upstream in a variable nginx re-resolves "backend" (every 10 s) instead of
    # pinning the IP it saw at startup, so recreating the backend container does not leave the UI on a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API: the browser never talks to the backend container directly.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow SSE streams (later milestones) to flush incrementally.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
